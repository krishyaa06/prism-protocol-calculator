<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism Protocol | Quantum Terminal</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="terminal-card">
        <!-- Branding Header -->
        <header class="terminal-header">
            <div class="brand">
                <img src="assets/logo.png" alt="Prism Protocol Logo" class="brand-logo" onerror="this.style.display='none'">
                <div class="brand-text">
                    <h1>PRISM PROTOCOL</h1>
                    <span class="status-badge"><span class="pulse"></span> QUANTUM SYSTEM V2.4</span>
                </div>
            </div>
            <!-- Mode Switcher -->
            <div class="nav-modes">
                <button class="mode-btn active" data-mode="standard">STD</button>
                <button class="mode-btn" data-mode="scientific">SCI</button>
                <button class="mode-btn" data-mode="programmer">PROG</button>
                <button class="mode-btn" data-mode="defi">DEFI</button>
            </div>
        </header>

        <!-- Display Area -->
        <div class="display-panel">
            <div class="history-line" id="history-display"></div>
            <div class="main-line" id="main-display">0</div>
        </div>

        <!-- Extra Controls Panel (Dynamic for SCI, PROG, DEFI) -->
        <div class="extra-grid" id="extra-grid" style="display: none;"></div>

        <!-- Standard Keypad -->
        <div class="keypad" id="keypad">
            <button class="btn btn-action" id="btn-clear">AC</button>
            <button class="btn btn-action" id="btn-delete">DEL</button>
            <button class="btn btn-sci-op" data-action="percent">%</button>
            <button class="btn btn-op" data-op="/">÷</button>

            <button class="btn btn-num">7</button>
            <button class="btn btn-num">8</button>
            <button class="btn btn-num">9</button>
            <button class="btn btn-op" data-op="*">×</button>

            <button class="btn btn-num">4</button>
            <button class="btn btn-num">5</button>
            <button class="btn btn-num">6</button>
            <button class="btn btn-op" data-op="-">-</button>

            <button class="btn btn-num">1</button>
            <button class="btn btn-num">2</button>
            <button class="btn btn-num">3</button>
            <button class="btn btn-op" data-op="+">+</button>

            <button class="btn btn-num btn-zero">0</button>
            <button class="btn btn-num">.</button>
            <button class="btn btn-equal" id="btn-equal">=</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
